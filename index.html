<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ночь в музее</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="event-card">
        <h1 id="event-title">Ночь в музее</h1>

        <p id="event-date">15 ноября, 18:30</p>
        <p id="event-place">Музей космонавтики, проспект Мира, 111</p>
        <p id="event-description">
          Вечерняя программа с выставкой и экскурсиями
        </p>

        <button id="show-program" type="button">Показать программу</button>

        <div id="program" hidden></div>
      </section>

      <section class="service-card">
        <form id="service-form" hidden>
          <h2>Дополнительные услуги</h2>

          <label>
            <input type="checkbox" id="guide" />
            Экскурсия с гидом — 500 руб.
          </label>

          <label>
            <input type="checkbox" id="audio" />
            Аудиогид — 350 руб.
          </label>

          <label>
            <input type="checkbox" id="catalog" />
            Каталог выставки — 250 руб.
          </label>

          <button type="submit">Рассчитать стоимость</button>
        </form>

        <p id="choice-error" hidden></p>
        <p id="data-error" hidden></p>

        <div id="result" hidden></div>
        <pre id="report-json" hidden></pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
